services:
  livekit:
    image: livekit/livekit-server:v1.10.1
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      NODE_IP: ${LIVEKIT_NODE_IP:?Set LIVEKIT_NODE_IP in infrastructure/livekit/.env}
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: info
          json: false
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP}
        room:
          empty_timeout: 300
          departure_timeout: 20
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - ${LIVEKIT_WEBHOOK_URL}
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
